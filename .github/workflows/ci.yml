name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: syntax + engine guarantees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 没有 npm install：运行时零依赖，为了让 CI「什么也不证明」而把 Electron 拉进容器，
      # 就是让仓库从此开始怕网络抖动。
      - name: Syntax check every source
        run: |
          for f in $(git ls-files 'js/*.js' 'js/*/*.js'); do node --check "$f" || exit 1; done
          node --check server.cjs
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check tools/playtest.cjs
          node --check tools/scenarios.js
          bash -n tools/verify.sh

      # 真正的门禁：每张出货盘都要「唯一解 + 一条都不猜就推到底」，而且铅笔规则落下的每条边
      # 都要和出题那盘参考环逐边同色。这些是纯 Node 测试，不用浏览器就能挡合并。
      - name: Rule tests (67 条断言：规则表对参考环/反例的行为)
        run: node tools/rule-test.mjs

      - name: Pencil solver (推错了必须为 0)
        run: node tools/pencil-test.mjs

      - name: Counter vs naive cross-check (五节：① 14 个题面逐个对账，朴素枚举当裁判)
        run: node tools/counter-test.mjs

      - name: Generator actually ships
        run: node tools/generator-probe.mjs

      - name: Entry files exist
        run: test -f index.html && grep -q '<canvas' index.html && grep -q 'js/main.js' index.html
